  <radialGradient id="anillo" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#5B8FD0"/><stop offset="0.6" stop-color="#2D5799"/><stop offset="1" stop-color="#18336A"/></radialGradient>
  <clipPath id="cuerdas"><ellipse cx="0" cy="-95" rx="54" ry="72"/></clipPath>
