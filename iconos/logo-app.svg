    <use href="#raqueta" xlink:href="#raqueta" transform="translate(-1 5) rotate(-34) scale(0.2) translate(0 -20)"/>
    <use href="#raqueta" xlink:href="#raqueta" transform="translate(1 5) rotate(34) scale(0.2) translate(0 -20)"/>
    <g font-family="Arial Narrow, Roboto Condensed, Arial, sans-serif" font-weight="700" font-size="9.2" fill="#fff" letter-spacing="0.3">
