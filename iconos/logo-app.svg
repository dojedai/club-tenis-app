    </g>
    <ellipse cx="0" cy="-95" rx="62" ry="80" fill="none" stroke="#fff" stroke-width="13"/>
    <path d="M-33 -30L-9 45M33 -30L9 45" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <rect x="-12" y="40" width="24" height="115" rx="9" fill="#fff"/>
