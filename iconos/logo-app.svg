    <rect x="176" y="372" width="160" height="34" rx="8" fill="#fff"/>
    <rect x="226" y="381" width="60" height="16" rx="4" fill="#F7931E"/>
    <use href="#insignia" xlink:href="#insignia" transform="translate(256 206) scale(1.9)"/>
