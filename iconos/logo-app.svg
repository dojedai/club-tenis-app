  <path id="arcoInf" d="M-46.5 0A46.5 46.5 0 0 0 46.5 0"/>
  <!-- Círculo del logo: pelota y raquetas cruzadas -->
  <g id="escudo">
    <circle r="50" fill="url(#naranja)"/>
    <use href="#raqueta" xlink:href="#raqueta" transform="translate(-2 8) rotate(-32) scale(0.27) translate(0 -20)"/>
